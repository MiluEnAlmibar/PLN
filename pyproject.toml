[project]
name = "pln"
version = "0.1.0"
description = "Práctica PLN mediante Deep Learning 26/27: PAN 2026 Multi-Author Writing Style Analysis"
readme = "README.md"
authors = [
    { name = "Miriam Bernat", email = "miriam.bernat03@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "evaluate>=0.4.6",
    "matplotlib>=3.11.2",
    "numpy>=2.4",
    "pandas>=3.0.6",
    "peft>=0.21.2",
    "protobuf>=7.36.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "sentencepiece>=0.2.3",
    "torch>=2.13.0",
    "transformers>=5.17.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]

[tool.uv]
# Proyecto basado en notebooks: no se construye ningún paquete
package = false
